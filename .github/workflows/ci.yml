name: CI

# Runs on every push and every pull request.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IndividualProject

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Fails the build if any unit test fails or if JaCoCo branch
      # coverage is below the 85% rule configured in pom.xml.
      - name: Build, test and verify coverage
        run: ./mvnw -B clean verify

      # Fails the build if Checkstyle reports any violation.
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: IndividualProject/target/site/jacoco/
