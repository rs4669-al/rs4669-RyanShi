<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Compare</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f2; color: #202020; }
    main { max-width: 760px; margin: 48px auto; padding: 0 20px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 14px; padding: 28px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06); }
    h1 { margin-top: 0; margin-bottom: 8px; }
    .subtitle { color: #666; margin-top: 0; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-weight: 600; font-size: 14px; }
    input, select, button { width: 100%; margin-top: 7px; padding: 11px 12px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    button { margin-top: 20px; background: #202020; color: white; cursor: pointer; }
    button:hover { background: #3b3b3b; }
    .result { margin-top: 24px; padding: 18px; border-radius: 10px; background: #f0f0ec; display: none; }
    .result strong { font-size: 24px; }
    .error { color: #a11; }
    .meta { color: #666; font-size: 13px; margin-top: 10px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>State Tax Comparison</h1>
      <p class="subtitle">Enter a price and category to calculate the tax using the Tax API Service.</p>
      <form id="tax-form">
        <div class="grid">
          <label>API key<input id="api-key" value="540ba996-2ae9-4f72-8b4f-014b463bc4d7" required></label>
          <label>Price<input id="price" type="number" min="0" step="0.01" value="100" required></label>
          <label>State<select id="state" required></select></label>
          <label>Category<select id="category" required></select></label>
        </div>
        <button type="submit">Calculate tax</button>
      </form>
      <div id="result" class="result"></div>
      <div class="meta">This page is served by the Spring Boot Tax API application.</div>
    </div>
  </main>
  <script>
    const stateSelect = document.getElementById("state");
    const categorySelect = document.getElementById("category");
    const result = document.getElementById("result");

    async function loadSupported() {
      const key = document.getElementById("api-key").value.trim();
      const response = await fetch("/v1/supported", { headers: { "X-API-Key": key } });
      if (!response.ok) throw new Error("The API key was not accepted by /v1/supported.");
      const data = await response.json();
      stateSelect.innerHTML = data.states.map(state => `<option value="${state}">${state}</option>`).join("");
      categorySelect.innerHTML = data.categories.map(category => `<option value="${category}">${category}</option>`).join("");
      if ([...stateSelect.options].some(option => option.value === "CA")) stateSelect.value = "CA";
      if ([...categorySelect.options].some(option => option.value === "clothing")) categorySelect.value = "clothing";
    }

    document.getElementById("api-key").addEventListener("change", () => loadSupported().catch(showError));

    document.getElementById("tax-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      result.style.display = "none";
      const key = document.getElementById("api-key").value.trim();
      const body = { price: Number(document.getElementById("price").value), category: categorySelect.value, state: stateSelect.value };
      try {
        const response = await fetch("/v1/tax/quote", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-API-Key": key },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error("The Tax API could not calculate a quote for that combination.");
        const data = await response.json();
        result.className = "result";
        result.innerHTML = `<div>Tax rate</div><strong>${(data.taxRate * 100).toFixed(2)}%</strong><p>Tax: $${data.taxAmount.toFixed(2)}<br>Total: $${data.total.toFixed(2)}</p>`;
        result.style.display = "block";
      } catch (error) { showError(error); }
    });

    function showError(error) {
      result.className = "result error";
      result.textContent = error.message;
      result.style.display = "block";
    }

    loadSupported().catch(showError);
  </script>
</body>
</html>
